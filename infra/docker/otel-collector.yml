# Collecteur OpenTelemetry minimal pour le développement local.
# En dev, les traces/métriques/logs sont simplement journalisées dans la console du conteneur ;
# en staging/production, les exportateurs pointent vers Sentry/Cloud Monitoring (voir ADR-017,
# docs/blueprint/12-devops-monitoring.md §5).

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
