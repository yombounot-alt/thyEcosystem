# CI du backend (backend/) — voir docs/plans/phase-0-foundation.md L0.3.
# Se déclenche sur toute PR/push vers main (pas seulement celles qui touchent backend/) : une PR
# vide doit aussi passer au vert, preuve que le squelette CI lui-même fonctionne.
name: CI Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Lint, typecheck, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version pnpm lue depuis packageManager (package.json racine)
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    name: Tests e2e (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Même image que infra/docker/compose.dev.yml : postgis n'est pas encore utilisée par les
        # migrations, mais un futur module géo (Immo, Delivery) ne doit pas surprendre la CI.
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: thy_migrator
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: thy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U thy_migrator -d thy"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://thy_app:changeme@localhost:5432/thy
      MIGRATOR_DATABASE_URL: postgres://thy_migrator:changeme@localhost:5432/thy
      REDIS_URL: redis://localhost:6379
      # Les e2e tournent sur le stockage S3 (RustFS), le chemin de production ; l'adaptateur disque
      # reste couvert par test/kernel/storage.e2e-spec.ts (même contrat, les deux adaptateurs).
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://localhost:9002
      S3_BUCKET: thy-test
      S3_ACCESS_KEY_ID: thy_s3
      S3_SECRET_ACCESS_KEY: changeme123
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Le service ne peut pas monter infra/docker/postgres/init (il démarre avant le checkout) :
      # on rejoue donc ici, à l'identique, ce que docker-entrypoint-initdb.d ferait en local — les
      # tests RLS vérifient que le rôle thy_app existe exactement comme ces scripts le créent.
      - name: Rôles applicatifs & extensions (infra/docker/postgres/init)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=changeme psql -h localhost -U thy_migrator -d thy -v ON_ERROR_STOP=1 \
            -f infra/docker/postgres/init/01-roles.sql
          PGPASSWORD=changeme psql -h localhost -U thy_migrator -d thy -v ON_ERROR_STOP=1 \
            -f infra/docker/postgres/init/02-extensions.sql

      # Stockage S3 : même image qu'en local (infra/docker/compose.dev.yml, service `s3`), même port
      # hôte 9002. RustFS et non MinIO : les images minio/* ont été retirées de Docker Hub. Le bucket
      # est créé avec l'AWS CLI préinstallée sur les runners Ubuntu.
      - name: Stockage S3 (RustFS) + bucket de test
        env:
          AWS_ACCESS_KEY_ID: thy_s3
          AWS_SECRET_ACCESS_KEY: changeme123
          AWS_DEFAULT_REGION: us-east-1
        run: |
          docker run -d --name s3 -p 9002:9000 -e RUSTFS_ACCESS_KEY=thy_s3 \
            -e RUSTFS_SECRET_KEY=changeme123 rustfs/rustfs:1.0.0
          for i in $(seq 1 30); do curl -fsS http://localhost:9002/health && break; sleep 2; done
          aws --endpoint-url http://localhost:9002 s3 mb s3://thy-test

      - run: pnpm --filter @thy/backend run build

      # Le contrat OpenAPI versionné (docs/api/openapi.json) doit correspondre au code : un
      # changement d'API sans `openapi:export` fait échouer la CI (il se voit alors en revue).
      - name: Contrat OpenAPI à jour
        run: |
          pnpm --filter @thy/backend run openapi:export
          git diff --exit-code -- docs/api/openapi.json

      - run: pnpm --filter @thy/backend run migrate
      - run: pnpm --filter @thy/backend run test:e2e

  image:
    name: Image Docker (build + vérification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Contexte = racine du dépôt (espace de travail pnpm) — même commande que le README d'infra.
      - run: docker build -f backend/Dockerfile -t thy-backend:ci .
      # Le client Prisma généré et son moteur doivent être PRÉSENTS dans l'image finale : sans ça,
      # l'API démarre puis échoue à la première requête. `new PrismaClient()` ne se connecte pas.
      - name: Le client Prisma est utilisable dans l'image
        run: |
          docker run --rm thy-backend:ci node -e \
            "const { PrismaClient } = require('@prisma/client'); new PrismaClient(); console.log('prisma client ok')"
      - name: L'image tourne en non-root
        run: |
          test "$(docker run --rm thy-backend:ci id -u)" != "0"
