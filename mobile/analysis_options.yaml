# Configuration d'analyse statique partagée par tous les packages du workspace mobile.
# Chaque package Flutter/Dart importe ce fichier via :
#   include: ../../analysis_options.yaml   (depuis mobile/app ou mobile/packages/<pkg>)
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore # faux positifs connus avec freezed/json_serializable
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gr.dart"
    - "build/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - unawaited_futures
    - unnecessary_await_in_return
    - use_key_in_widget_constructors
