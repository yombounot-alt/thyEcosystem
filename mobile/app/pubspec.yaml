name: thy_app
description: THY — application mobile (module Business en premier ; les autres modules suivent).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  share_plus: ^13.3.0
  image_picker: ^1.2.0
  pdf: ^3.11.0
  shared_preferences: ^2.5.0
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.4.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Embedded in the PDF receipts (see assets/fonts/README.md).
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
